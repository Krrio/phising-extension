[project]
name = "guardian_classic"
version = "0.1.0"
description = "guardian_classic using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.8,<2.0.0",
    "python-levenshtein>=0.27.3",
    "python-whois>=0.9.6",
]

[project.scripts]
guardian_classic = "guardian_classic.main:run"
run_crew = "guardian_classic.main:run"
train = "guardian_classic.main:train"
replay = "guardian_classic.main:replay"
test = "guardian_classic.main:test"
run_with_trigger = "guardian_classic.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

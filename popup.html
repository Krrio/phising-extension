<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="dist/styles.css" />
  </head>
  <body
    class="flex min-h-96 w-72 flex-col bg-white p-5 font-poppins text-zinc-900"
  >
    <header class="mb-8 flex items-center justify-center gap-3">
      <img src="assets/images/logo.svg" alt="Phishing Guard" class="h-8 w-8" />
      <h1 class="text-xl font-medium">Phishing Guard</h1>
    </header>

    <div class="mt-auto space-y-3">
      <div class="flex items-center justify-between">
        <span class="font-normal">Autonomy level:</span>
        <select
          id="autonomyLevel"
          class="cursor-pointer rounded-md border-0 bg-transparent font-medium focus:outline-none"
        >
          <option value="limited">Limited</option>
          <option value="standard">Manual</option>
          <option value="full">Automatic</option>
          <option value="guardian">Guardian</option>
        </select>
      </div>

      <div class="flex items-center justify-between">
        <span class="font-normal">Catched phrases:</span>
        <span id="catchedPhrases" class="font-medium">1218</span>
      </div>
    </div>

    <hr class="my-4 border-zinc-200" />

    <div class="flex items-center justify-between">
      <span class="font-normal">Extension ON</span>
      <label class="relative inline-flex cursor-pointer items-center">
        <input type="checkbox" id="enabledToggle" class="peer sr-only" />
        <div
          class="peer h-6 w-11 rounded-full bg-zinc-300 peer-checked:bg-green-500 after:absolute after:left-0.5 after:top-0.5 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition-all after:content-[''] peer-checked:after:translate-x-5"
        ></div>
      </label>
    </div>

    <input
      type="password"
      id="apiKey"
      placeholder="Twój klucz OpenAI"
      class="mt-2 p-2 border-gray-400 rounded-full focus-visible:ring-0"
    />

    <button
      id="openDashboard"
      type="button"
      class="mt-5 w-full rounded-full border border-zinc-300 px-3 py-2 text-sm font-medium transition-colors hover:bg-zinc-100"
    >
      Historia analiz
    </button>
    <script src="dist/popup.js"></script>
  </body>
</html>
